name: Daily X Digest

# 北京/新加坡 08:17 = UTC 00:17
# 避开 GitHub Actions 整点高峰，并支持手动触发和历史回填
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 0 * * *"
  workflow_dispatch:
    inputs:
      digest_date:
        description: "Optional digest date to generate (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string
        default: ""
      deploy_pages:
        description: "Deploy GitHub Pages from the selected branch. For non-main branches, the github-pages environment must allow this branch."
        required: false
        type: boolean
        default: false
  # Updating this file with a YYYY-MM-DD value triggers a dated run.
  push:
    branches:
      - main
    paths:
      - ".github/digest-trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: x-daily-digest-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.daily_guard.outputs.should_run }}
      target_date: ${{ steps.daily_guard.outputs.target_date }}

    steps:
      - name: Show workflow context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve target date and validate existing digest
        id: daily_guard
        shell: bash
        env:
          REQUESTED_DATE: ${{ github.event.inputs.digest_date || '' }}
        run: |
          TODAY="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          TARGET_DATE="$TODAY"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_DATE" ]]; then
            TARGET_DATE="$REQUESTED_DATE"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -f .github/digest-trigger ]]; then
            TRIGGER_DATE="$(head -n 1 .github/digest-trigger | tr -d '[:space:]')"
            if [[ "$TRIGGER_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              TARGET_DATE="$TRIGGER_DATE"
            fi
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
             ! date -d "$TARGET_DATE" '+%Y-%m-%d' >/dev/null 2>&1; then
            echo "Invalid target date: $TARGET_DATE"
            exit 1
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          DIGEST="digests/${TARGET_DATE}.md"
          VALID_DIGEST=false

          if [[ -f "$DIGEST" ]] && grep -Eq '^【ITEM[0-9]+】$' "$DIGEST"; then
            VALID_DIGEST=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$VALID_DIGEST" == "true" ]]; then
            echo "Today's valid digest already exists: $DIGEST"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            if [[ -f "$DIGEST" && "$VALID_DIGEST" != "true" ]]; then
              echo "Target digest exists but is invalid or empty; regenerating: $DIGEST"
            else
              echo "Digest generation is required for $TARGET_DATE."
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.daily_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.daily_guard.outputs.should_run == 'true'
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import shutil
          print('twitter=', shutil.which('twitter'))
          print('twitter-cli=', shutil.which('twitter-cli'))
          PY

      - name: Run daily pipeline
        if: steps.daily_guard.outputs.should_run == 'true'
        env:
          TZ: Asia/Shanghai
          TARGET_DATE: ${{ steps.daily_guard.outputs.target_date }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          ALL_PROXY: ${{ secrets.ALL_PROXY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Need DEEPSEEK_API_KEY"; exit 1; }
          test -n "$TWITTER_AUTH_TOKEN" || { echo "Need TWITTER_AUTH_TOKEN"; exit 1; }
          test -n "$TWITTER_CT0" || { echo "Need TWITTER_CT0"; exit 1; }
          python scripts/run_daily.py --date "$TARGET_DATE"

          DIGEST="digests/${TARGET_DATE}.md"
          test -f "$DIGEST" || { echo "$DIGEST was not generated"; exit 1; }
          grep -Eq '^【ITEM[0-9]+】$' "$DIGEST" || {
            echo "$DIGEST does not contain a valid digest body"
            exit 1
          }
          test -f docs/index.html || { echo "docs/index.html was not generated"; exit 1; }

      - name: Commit generated files
        if: steps.daily_guard.outputs.should_run == 'true'
        env:
          TARGET_DATE: ${{ steps.daily_guard.outputs.target_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A digests docs

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(digest): ${TARGET_DATE}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  deploy-pages:
    needs: build-and-commit
    runs-on: ubuntu-latest
    if: >-
      ${{
        needs.build-and-commit.outputs.should_run == 'true' &&
        (
          github.event_name == 'schedule' ||
          github.ref_name == 'main' ||
          github.event.inputs.deploy_pages == 'true'
        )
      }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout generated files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
